name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      github.event.comment.user.type != 'Bot' &&
      !endsWith(github.event.comment.user.login, '[bot]') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Enforce PR attempt budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null || github.event.pull_request.number != null }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
        run: |
          if [ "$IS_PULL_REQUEST" != "true" ] || [ -z "$PR_NUMBER" ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_sha=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')
          attempts=$(gh api --paginate "repos/${{ github.repository }}/actions/runs?head_sha=$head_sha&per_page=100" \
            --jq --argjson current_run_id "$GITHUB_RUN_ID" \
            '.workflow_runs[] | select(.name == "opencode" and .id != $current_run_id and .conclusion != "skipped") | (.run_attempt // 1)' |
            awk '{ total += $1 } END { print total + 0 }')
          attempts=$((attempts + GITHUB_RUN_ATTEMPT - 1))
          if [ "$attempts" -ge 3 ]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "limit_exhausted: 3 OpenCode attempts were already used for this PR head; no model call was made. Last SHA: \`$head_sha\`. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OpenCode
        if: steps.budget.outputs.blocked != 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: openai/gpt-5.4-mini-fast
          mentions: /opencode,/oc
          use_github_token: true
