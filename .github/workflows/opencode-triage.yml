name: opencode-triage

on:
  issues:
    types: [opened]

concurrency:
  group: opencode-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: |
      github.event.issue.user.type != 'Bot' &&
      !endsWith(github.event.issue.user.login, '[bot]') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode triage
        uses: anomalyco/opencode/github@latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: openai/gpt-5.4-mini-fast
          mentions: /opencode,/oc
          use_github_token: true
          prompt: |
            You are performing initial triage for an incoming GitHub issue.
            Read AGENTS.md, GLOSSARY.md, docs/agents/domain.md,
            docs/agents/issue-tracker.md, and docs/agents/triage-labels.md.

            Inspect the existing application before proposing work.
            Use the triage skill. Do not change code or create implementation
            tickets. Explain whether the issue matches existing behavior,
            identify missing requirements, and ask concise follow-up questions.
            Use needs-info when requirements are missing and needs-triage
            when the first review is incomplete.
            Never process issues labeled ready-for-agent.
