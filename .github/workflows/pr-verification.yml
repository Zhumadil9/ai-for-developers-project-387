name: pr-verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-head:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record exact PR head
        run: |
          echo "PR_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD

      - uses: jdx/mise-action@v3
      - run: mise run install
      - run: npx -w frontend playwright install --with-deps chromium
      - run: npm run check

      - name: Run head Playwright trace
        run: npx -w frontend playwright test --trace on

      - name: Upload head verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-head-${{ github.event.pull_request.head.sha }}
          path: |
            frontend/test-results/
          if-no-files-found: warn
